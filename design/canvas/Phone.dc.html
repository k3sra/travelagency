<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Cinzel:wght@400;500&family=Crimson+Text:ital,wght@0,400;0,600&display=swap">
  <style>
    body { margin: 0; background: #fbf8f1; color: #2d3a3a; font-family: "Crimson Text", Georgia, serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; } a:hover { color: #d4af37; }
    .caps { font-family: "Cinzel", "Times New Roman", serif; font-size: 11.5px; letter-spacing: 0.32em; text-transform: uppercase; line-height: 1.6; }
    .display { font-family: "Playfair Display", Georgia, serif; font-weight: 400; line-height: 0.98; letter-spacing: -0.015em; }
    .display em { font-style: italic; color: #d4af37; }
    .pill { display: inline-flex; align-items: center; justify-content: center; min-height: 60px; padding: 0 40px; border-radius: 999px; border: 1px solid rgba(251,248,241,0.45); font-family: "Cinzel", serif; font-size: 13.4px; letter-spacing: 0.32em; text-transform: uppercase; white-space: nowrap; }
    .img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</helmet>

<div style="display: flex; gap: 40px; align-items: flex-start;">

  <!-- Phone 1: hero -->
  <div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #121a1a; color: #fbf8f1; display: flex; flex-direction: column; justify-content: flex-end;">
    <img src="hero-poster.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%;">
    <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(18,26,26,0.9) 0%, rgba(18,26,26,0.45) 45%, rgba(18,26,26,0) 100%);"></div>
    <div style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 22px 20px;">
      <div style="display: flex; align-items: baseline; gap: 8px; font-family: 'Cinzel', serif; text-transform: uppercase;"><span style="font-size: 16.8px; letter-spacing: 0.34em; font-weight: 500;">Fable</span><span style="font-size: 9.3px; letter-spacing: 0.42em; opacity: 0.72;">Travels</span></div>
      <a class="caps" href="#">Journeys</a>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 22px; padding: 0 20px 104px;">
      <p class="caps" style="margin: 0; font-size: 10px; color: #d4af37;">Fable Travels · Small-group journeys for grown-ups</p>
      <h1 class="display" style="margin: 0; font-size: 54px; max-width: 8ch;">Write your own <em>legend.</em></h1>
      <div style="display: flex;"><a class="pill" href="#" style="padding: 0 34px;">Curate Your Journey</a></div>
    </div>
    <div style="position: absolute; left: 20px; bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px;"><span class="caps" style="font-size: 9.6px; color: rgba(251,248,241,0.58); writing-mode: vertical-rl;">Scroll</span><span style="width: 1px; height: 40px; background: #d4af37;"></span></div>
  </div>

  <!-- Phone 2: The Collective on the package page -->
  <div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #2d3a3a; color: rgba(251,248,241,0.92); display: flex; flex-direction: column; gap: 22px; padding: 56px 20px 0;">
    <p class="caps" style="margin: 0; font-size: 10px; color: rgba(251,248,241,0.58);">The Collective · 8 of 10 confirmed</p>
    <h2 class="display" style="margin: 0; font-size: 40px;">Who is already going</h2>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 6px;"><span class="caps" style="font-size: 10px; color: #d4af37;">[ 85% Cultural Deep Dive ]</span><div style="height: 1px; background: rgba(251,248,241,0.14);"><div style="width: 85%; height: 1px; background: #d4af37;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><span class="caps" style="font-size: 10px; color: #d4af37;">[ 68% Slow Mornings ]</span><div style="height: 1px; background: rgba(251,248,241,0.14);"><div style="width: 68%; height: 1px; background: #d4af37;"></div></div></div>
    </div>
    <div style="position: relative; height: 380px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 12px; animation: drift 38s linear infinite;">
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><div style="aspect-ratio: 3 / 4; overflow: hidden; background: #1c2626;"><img class="img" src="portrait-01.jpg" alt="" style="filter: grayscale(1) contrast(1.05);"></div><span class="caps" style="font-size: 9px;">Amara · Lagos → London</span><span class="caps" style="font-size: 9px; color: #d4af37;">94% aligned</span></figure>
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><div style="aspect-ratio: 3 / 4; overflow: hidden; background: #1c2626;"><img class="img" src="portrait-03.jpg" alt="" style="filter: grayscale(1) contrast(1.05);"></div><span class="caps" style="font-size: 9px;">Priya · Mumbai → Berlin</span><span class="caps" style="font-size: 9px; color: #d4af37;">88% aligned</span></figure>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 70px; animation: drift 46s linear infinite;">
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><div style="aspect-ratio: 3 / 4; overflow: hidden; background: #1c2626;"><img class="img" src="portrait-02.jpg" alt="" style="filter: grayscale(1) contrast(1.05);"></div><span class="caps" style="font-size: 9px;">Tomas · Lisbon</span><span class="caps" style="font-size: 9px; color: #d4af37;">91% aligned</span></figure>
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><div style="aspect-ratio: 3 / 4; overflow: hidden; background: #1c2626;"><img class="img" src="portrait-04.jpg" alt="" style="filter: grayscale(1) contrast(1.05);"></div><span class="caps" style="font-size: 9px;">Leonie · Zürich</span><span class="caps" style="font-size: 9px; color: #d4af37;">87% aligned</span></figure>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(to top, #2d3a3a, rgba(45,58,58,0));"></div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 22px; background: rgba(28,38,38,0.94); border-top: 1px solid rgba(212,175,55,0.42);">
      <div style="display: flex; align-items: center; justify-content: space-between;"><span class="caps" style="font-size: 9.3px; color: rgba(251,248,241,0.72);">Kyoto, in Silence</span><span class="caps" style="font-size: 9.3px; color: #d4af37; animation: pulse 2.4s ease-in-out infinite;">[ 2 Spots Remaining ]</span></div>
      <a class="pill" href="#" style="min-height: 52px; border-color: #d4af37; font-size: 11.5px;">Secure Your Spot</a>
    </div>
  </div>
</div>
<style>
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-30%); } }
</style>
</x-dc>
</body>
</html>
